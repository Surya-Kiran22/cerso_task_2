version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: srs-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend1:
    build: ./backend
    container_name: srs-backend1
    restart: always
    hostname: backend1
    environment:
      - PORT=5000
      - HOSTNAME=backend1
      - MONGODB_URI=mongodb://mongo:27017/srs_ambiguity_db
      - JWT_SECRET=supersecretjwtkey_srs_ambiguity_detector_2026
      - CLIENT_ORIGIN=*
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_healthy

  backend2:
    build: ./backend
    container_name: srs-backend2
    restart: always
    hostname: backend2
    environment:
      - PORT=5000
      - HOSTNAME=backend2
      - MONGODB_URI=mongodb://mongo:27017/srs_ambiguity_db
      - JWT_SECRET=supersecretjwtkey_srs_ambiguity_detector_2026
      - CLIENT_ORIGIN=*
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_healthy

  backend3:
    build: ./backend
    container_name: srs-backend3
    restart: always
    hostname: backend3
    environment:
      - PORT=5000
      - HOSTNAME=backend3
      - MONGODB_URI=mongodb://mongo:27017/srs_ambiguity_db
      - JWT_SECRET=supersecretjwtkey_srs_ambiguity_detector_2026
      - CLIENT_ORIGIN=*
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_healthy

  nginx:
    build: ./frontend
    container_name: srs-nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy

volumes:
  mongo_data:
